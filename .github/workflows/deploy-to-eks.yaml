name: Create EKS cluster, deploy Kubeflow Terraform solution and run UATs

on:
  workflow_dispatch:
    inputs:
      k8s_version:
        description: 'Kubernetes version to use for the EKS cluster (e.g. 1.35)'
        required: false
      uats_branch:
        description: 'Branch to run the UATs from, e.g., main or track/1.10'
        required: false
      ckf_branch:
        description: 'Branch on the Charmed Kubeflow repository to be tested'
        required: false
      risk:
        description: 'The risk level to be tested'
        required: false
        default: 'stable'
      juju_agent_version:
        description: 'Juju agent version to use when bootstrapping. Leave empty to use the default.'
        required: false
  schedule:
    - cron: "30 00 * * 1"

env:
  CLUSTER_NAME: kubeflow-eks-test
  # Custom argo images (with CA certificates) for the non-IAM products/kubeflow deployment.
  ARGO_EXECUTOR_IMAGE: docker.io/dariofaccin/argoexec:3.7.17-d9d445d
  ARGO_WORKFLOW_CONTROLLER_IMAGE: docker.io/dariofaccin/workflow-controller:3.7.17-d9d445d

jobs:
  deploy-solution-to-eks:
    name: Deploy to EKS
    runs-on: ubuntu-24.04

    strategy:
      # Serialize runs so concurrent workflows don't clash on the shared EKS cluster.
      max-parallel: 1
      fail-fast: false
      matrix:
        service-mesh-type: [sidecar, ambient]
        product:
          - name: kubeflow
            uats-env: kubeflow-remote
        pod-security-standards:
          - policy: privileged
            istio-cni-bin-dir: ""  # meaning Istio CNI disabled
            istio-cni-conf-dir: ""  # meaning Istio CNI disabled
          - policy: baseline
            istio-cni-bin-dir: /opt/cni/bin
            istio-cni-conf-dir: /etc/cni/net.d
        auth-type: [dex]
        include:
          - product:
              name: kubeflow
              uats-env: kubeflow-remote
            uats-extra-args: --include-multi-tenancy-tests
          # Keep after the kubeflow entry above so it overrides that uats-extra-args value.
          - service-mesh-type: ambient
            product:
              name: kubeflow
              uats-env: kubeflow-remote
            uats-extra-args: --include-ambient-tests --include-multi-tenancy-tests
          - service-mesh-type: ambient
            product:
              name: kubeflow
              uats-env: kubeflow-remote
            pod-security-standards:
              policy: privileged
            auth-type: iam
            uats-extra-args: --include-ambient-tests --include-iam-m2m-tests --include-iam-ui-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set envvars from dependencies.yaml
        run: |
          yq eval 'to_entries | .[] | "\(.key)=\(.value)"' ".github/dependencies.yaml" | while IFS= read -r line; do
            echo "$line" >> "$GITHUB_ENV"
          done

      - name: Update ENV variables from inputs if available
        run: |
          K8S_VERSION=${{ inputs.k8s_version || env.EKS_VERSION }}
          echo "K8S_VERSION=${K8S_VERSION}" >> $GITHUB_ENV
          CKF_BRANCH=${{ inputs.ckf_branch || env.CKF_BRANCH }}
          echo "CKF_BRANCH=${CKF_BRANCH}" >> $GITHUB_ENV
          RISK=${{ inputs.risk || env.RISK }}
          echo "RISK=${RISK}" >> $GITHUB_ENV
          UATS_BRANCH=${{ inputs.uats_branch || env.UATS_BRANCH }}
          echo "UATS_BRANCH=${UATS_BRANCH}" >> $GITHUB_ENV

      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry

      - name: Install snaps
        run: |
          sudo snap install juju --channel=${{ env.JUJU_VERSION }}/stable
          sudo snap install charmcraft --channel 3.x/stable --classic
          sudo snap install terraform --channel=latest/stable --classic
          sudo snap install kubectl --classic --channel=${{ env.K8S_VERSION }}/stable
          mkdir -p ~/.kube

      - name: Install eksctl
        run: |
          PLATFORM=$(uname -s)_amd64
          curl -fsSL "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_${PLATFORM}.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-profile: default
          output-env-credentials: true

      # Pre-clean any leftover cluster/stack from a previous failed run.
      - name: Pre-delete EKS cluster and stack (if they exist)
        uses: ./.github/actions/teardown-eks-cluster
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Create EKS cluster
        run: |
          yq e ".metadata.name |= \"${{ env.CLUSTER_NAME }}\"" -i .github/cluster.yaml
          yq e ".metadata.version |= \"${{ env.K8S_VERSION }}\"" -i .github/cluster.yaml
          yq e ".metadata.region |= \"${{ vars.AWS_REGION }}\"" -i .github/cluster.yaml

          ssh-keygen -q -t rsa -N '' -f ~/.ssh/id_rsa <<<y >/dev/null 2>&1
          eksctl create cluster -f .github/cluster.yaml
          kubectl get nodes

      - name: Configure EKS nodes
        run: |
          echo "Configuring sysctl on EKS workers"
          source ./scripts/gh-actions/set_eks_sysctl_config.sh

      - name: Setup Juju controller
        run: |
          /snap/juju/current/bin/juju add-k8s eks --client

          AGENT_VERSION_ARG=""
          if [[ -n "${{ inputs.juju_agent_version }}" ]]; then
            AGENT_VERSION_ARG="--agent-version=${{ inputs.juju_agent_version }}"
          fi

          juju bootstrap eks eks-controller $AGENT_VERSION_ARG

      - name: Setup object storage
        id: object-storage
        shell: bash
        run: |
          # KFP's shared object storage must be reachable from inside the EKS
          # cluster, so back it with real S3 buckets instead of a runner-local
          # microceph (which remote EKS pods could not reach). Buckets live in
          # the cluster's region and are addressed via the regional endpoint.
          REGION="${{ vars.AWS_REGION }}"
          GLOBAL_BUCKET="${CLUSTER_NAME}-kfp-global-${{ github.run_id }}-${{ strategy.job-index }}"
          OVERRIDE_BUCKET="${CLUSTER_NAME}-kfp-override-${{ github.run_id }}-${{ strategy.job-index }}"

          create_bucket() {
            # us-east-1 rejects a LocationConstraint; every other region requires it.
            if [[ "$REGION" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "$1" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$1" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
          }
          create_bucket "$GLOBAL_BUCKET"
          create_bucket "$OVERRIDE_BUCKET"

          echo "global_bucket=$GLOBAL_BUCKET" >> "$GITHUB_OUTPUT"
          echo "override_bucket=$OVERRIDE_BUCKET" >> "$GITHUB_OUTPUT"
          {
            echo "S3_SERVER_URL_GLOBAL=https://s3.${REGION}.amazonaws.com"
            echo "S3_ACCESS_KEY_GLOBAL=${{ secrets.AWS_ACCESS_KEY_ID }}"
            echo "S3_SECRET_KEY_GLOBAL=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            echo "S3_BUCKET_KFP_GLOBAL=$GLOBAL_BUCKET"
            echo "S3_REGION_GLOBAL=${REGION}"
            echo "S3_SERVER_URL_OVERRIDE=https://s3.${REGION}.amazonaws.com"
            echo "S3_ACCESS_KEY_OVERRIDE=${{ secrets.AWS_ACCESS_KEY_ID }}"
            echo "S3_SECRET_KEY_OVERRIDE=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            echo "S3_BUCKET_KFP_OVERRIDE=$OVERRIDE_BUCKET"
            echo "S3_REGION_OVERRIDE=${REGION}"
          } >> .env

      - name: Clone UATs repository
        run: |
          git clone https://github.com/canonical/charmed-kubeflow-uats.git ${{ github.workspace }}/charmed-kubeflow-uats
          cd ${{ github.workspace }}/charmed-kubeflow-uats
          git checkout ${{ env.UATS_BRANCH }}

      - name: Deploy solution
        id: deploy
        timeout-minutes: 60
        run: |
          if [[ '${{ github.event_name }}' != 'pull_request' ]]; then
            git checkout '${{ env.CKF_BRANCH }}'
          fi

          CNI_ARGS="--istio-cni-bin-dir ${{ matrix.pod-security-standards.istio-cni-bin-dir }} --istio-cni-conf-dir ${{ matrix.pod-security-standards.istio-cni-conf-dir }}"
          RISK_ARG="--risk ${{ env.RISK }}"
          SERVICE_MESH_TYPE_ARG="--service-mesh-type=${{ matrix.service-mesh-type }}"

          AUTH_TYPE_ARG=""
          if [[ -n "${{ matrix.auth-type }}" ]]; then
            AUTH_TYPE_ARG="--auth-type=${{ matrix.auth-type }}"
          fi

          EXTRA_COMPONENTS_ARG="--pss ${{ matrix.pod-security-standards.policy }}"

          tox -c ./terraform/tests -e test-deployment -- -vv -s $RISK_ARG $SERVICE_MESH_TYPE_ARG $AUTH_TYPE_ARG $CNI_ARGS $EXTRA_COMPONENTS_ARG

      - name: Run UATs
        id: run-uats
        run: |
          cd ${{ github.workspace }}/charmed-kubeflow-uats
          if [[ "${{ matrix.auth-type }}" == "iam" ]]; then
            poetry install --no-root
            poetry run playwright install --with-deps chromium
          fi
          extra_args=()
          # TODO: drop this skip and set istio-ingress-k8s `listener-hostname=""` once it
          # reaches 2/stable. On EKS the ambient gateway listener is pinned to the ELB
          # hostname, so KServe routes are rejected with NoMatchingListenerHostname.
          # See https://github.com/canonical/kserve-operators/issues/491
          if [[ "${{ matrix.service-mesh-type }}" == "ambient" ]]; then
            extra_args+=(-k "not kserve")
          fi
          tox -e ${{ matrix.product.uats-env }} -- --security-policy ${{ matrix.pod-security-standards.policy }} ${{ matrix.uats-extra-args }} "${extra_args[@]}" --keep-artifacts --log-file=uats-session.log --retry-timeout=1200

      - name: Collect and upload user namespace pods logs
        if: failure() && steps.run-uats.outcome == 'failure'
        uses: ./.github/actions/collect-k8s-logs
        with:
          name: user-namespace-pods-logs-${{ matrix.product.name }}-${{ matrix.service-mesh-type }}-${{ matrix.pod-security-standards.policy }}-${{ matrix.auth-type }}
          namespaces: test-kubeflow

      - name: Collect and upload M2M namespaces data
        if: failure() && matrix.auth-type == 'iam' && steps.run-uats.outcome == 'failure'
        uses: ./.github/actions/collect-k8s-logs
        with:
          name: m2m-namespaces-data-${{ matrix.product.name }}-${{ matrix.service-mesh-type }}-${{ matrix.pod-security-standards.policy }}-${{ matrix.auth-type }}
          namespace-pattern: test-m2m
          resources: rolebindings authorizationpolicies

      - name: Collect and upload multi-tenancy namespaces logs
        if: failure() && contains(matrix.uats-extra-args, '--include-multi-tenancy-tests') && steps.run-uats.outcome == 'failure'
        uses: ./.github/actions/collect-k8s-logs
        with:
          name: multi-tenancy-namespaces-logs-${{ matrix.product.name }}-${{ matrix.service-mesh-type }}-${{ matrix.pod-security-standards.policy }}-${{ matrix.auth-type }}
          namespaces: mt-tenant-global mt-tenant-override

      - name: Upload UATs notebooks artifacts
        if: failure() && steps.run-uats.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: uats-notebooks-${{ matrix.product.name }}-${{ matrix.service-mesh-type }}-${{ matrix.pod-security-standards.policy }}-${{ matrix.auth-type }}
          path: |
            charmed-kubeflow-uats/artifacts/
            charmed-kubeflow-uats/uats-session.log
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: failure() && steps.run-uats.outcome == 'failure' && matrix.auth-type == 'iam'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.auth-type }}
          path: charmed-kubeflow-uats/playwright-artifacts/
          if-no-files-found: ignore

      - name: Collect and upload control plane pods logs
        if: failure()
        uses: ./.github/actions/collect-k8s-logs
        with:
          name: control-planes-pods-logs-${{ matrix.product.name }}-${{ matrix.service-mesh-type }}-${{ matrix.pod-security-standards.policy }}-${{ matrix.auth-type }}
          namespaces: kubeflow istio-system ${{ matrix.auth-type == 'iam' && 'iam iam-core' || '' }}

      - name: Get juju status
        run: juju status -m kubeflow --relations
        if: always()

      - name: Get juju status for istio and iam models
        if: always() && matrix.auth-type == 'iam'
        run: |
          for model in istio-system iam iam-core; do
            echo "=== juju status -m $model ==="
            juju status -m "$model" --relations || true
          done

      # Clean up resources
      - name: Delete object storage buckets
        if: always()
        run: |
          for bucket in "${{ steps.object-storage.outputs.global_bucket }}" "${{ steps.object-storage.outputs.override_bucket }}"; do
            if [[ -n "$bucket" ]]; then
              aws s3 rb "s3://$bucket" --force || echo "Bucket $bucket not found or already deleted."
            fi
          done

      - name: Delete EKS cluster and stack
        if: always()
        uses: ./.github/actions/teardown-eks-cluster
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}

  delete-unattached-volumes:
      name: Clean unattached EBS volumes
      if: always()
      needs: [deploy-solution-to-eks]
      uses: ./.github/workflows/delete-aws-volumes.yaml
      with:
        region: ${{ vars.AWS_REGION }}
      secrets: inherit
