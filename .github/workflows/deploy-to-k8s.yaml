name: Validation on Canonical K8s
on:
  workflow_dispatch:
    inputs:
      k8s_version:
        description: 'Kubernetes version to be used for the K8s cluster.'
        required: false
      uats_branch:
        description: 'Branch to run the UATs from e.g. main or track/1.10. By default, this is defined by the dependencies.yaml file.'
        required: false
      ckf_branch:
        description: 'Branch on the Charmed Kubeflow repository to be tested'
        required: false
      risk:
        description: 'The risk level to be tested'
        required: false
        default: 'stable'
  pull_request:
  schedule:
    - cron: "17 02 * * 1"


jobs:
  deploy-solution:
    name: Deploy to Canonical K8s
    runs-on: ["self-hosted-linux-amd64-noble-xlarge"]
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        bundle:
          - module: kubeflow-mlflow
            uats:
              env: uats-remote
              extra-args: --filter "not feast and not spark"
          - module: kubeflow-feast
            uats:
              env: feast-remote
          - module: kubeflow-ambient
            uats:
              env: kubeflow-remote
              extra-args: --include-ambient-tests
          - module: kubeflow-spark
            tf-vars-file: examples/tfvars.json
            uats:
              env: spark-remote
              extra-args: --test-image ghcr.io/canonical/charmed-spark-jupyterlab:3.5-22.04_stable --bundle ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set envvars from dependencies.yaml
        run: |
          yq eval 'to_entries | .[] | "\(.key)=\(.value)"' ".github/dependencies.yaml" | while IFS= read -r line; do
            echo "$line" >> "$GITHUB_ENV"
          done

      - name: Update ENV variables from inputs if available
        run: |
          K8S_VERSION=${{ inputs.k8s_version || env.K8S_VERSION }}
          echo "K8S_VERSION=${K8S_VERSION}" >> $GITHUB_ENV
          CKF_BRANCH=${{ inputs.ckf_branch || env.CKF_BRANCH }}
          echo "CKF_BRANCH=${CKF_BRANCH}" >> $GITHUB_ENV
          RISK=${{ inputs.risk || env.RISK }}
          echo "RISK=${RISK}" >> $GITHUB_ENV
          UATS_BRANCH=${{ matrix.bundle.uats_branch || inputs.uats_branch || env.UATS_BRANCH }}
          echo "UATS_BRANCH=${UATS_BRANCH}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tox & poetry
        run: |
          sudo apt-get install -yqq pipx
          pipx ensurepath
          sudo pipx ensurepath

          pipx install tox
          pipx install poetry

      - name: Setup environment
        run: |
          # Avoiding dockerhub rate limits (see https://canonical-self-hosted-github-runner-docs.readthedocs-hosted.com/en/latest/usage/faq/how-to-avoid-dockerhub-rate-limits/ for more informations)
          if [ -n "$DOCKERHUB_MIRROR" ]; then
          MIRROR_CONFIG=/etc/containerd/hosts.d/docker.io

          sudo mkdir -p ${MIRROR_CONFIG}
          sudo chown $USER ${MIRROR_CONFIG}
          cat << EOF > ${MIRROR_CONFIG}/hosts.toml
          [host."$DOCKERHUB_MIRROR"]
          capabilities = ["pull", "resolve"]
          EOF
          fi

          sudo apt-get remove -y docker.io containerd
          sudo rm -rf /run/containerd
          sudo snap install concierge --classic
          cd .github

          # Set the K8s version
          yq -i e '.providers.k8s.channel = "${{ env.K8S_VERSION }}-classic/stable"' concierge.yaml

          sudo concierge prepare --trace
          cd ..

      - name: Configure Cilium for Istio
        if: matrix.bundle.module == 'kubeflow-ambient'
        run: |
          # for context, see https://docs.cilium.io/en/stable/network/servicemesh/istio/
          kubectl -n kube-system patch configmap cilium-config --type merge --patch '{"data":{"bpf-lb-sock-hostns-only":"true"}}'
          kubectl -n kube-system patch configmap cilium-config --type merge --patch '{"data":{"cni-exclusive":"false"}}'
          kubectl -n kube-system rollout restart daemonset cilium

      - name: Setup terraform
        run: |
          sudo snap install terraform  --channel latest/stable --classic
          terraform --version

      - name: Deploy solution
        timeout-minutes: 45
        run: |
          if [[ '${{ github.event_name }}' != 'pull_request' ]]; then
            git checkout '${{ env.CKF_BRANCH }}'
          fi

          RISK_ARG="--risk ${{ env.RISK }}"
          PLATFORM_ARG=""
          if [[ "${{ matrix.bundle.module }}" == "kubeflow-ambient" ]]; then
            PLATFORM_ARG="--istio-k8s-platform"
          fi
          TF_VARS_ARG=""
          if [[ -n "${{ matrix.bundle.tf-vars-file }}" ]]; then
            TF_VARS_ARG="--tf-vars-file ${{ matrix.bundle.tf-vars-file }}"
          fi

          tox -c ./modules/${{ matrix.bundle.module }} -e test_deployment -- -vv -s $RISK_ARG $TF_VARS_ARG $PLATFORM_ARG

      - name: Clone UATs repository
        timeout-minutes: 75
        run: |
          git clone https://github.com/canonical/charmed-kubeflow-uats.git ~/charmed-kubeflow-uats
          cd ~/charmed-kubeflow-uats
          git checkout ${{ env.UATS_BRANCH }}

      - name: Preload Images into Containerd Cache
        run: |
          echo "Starting image preload process..."

          MAX_RETRIES=3
          RETRY_DELAY=5

          IMAGE_LIST=~/charmed-kubeflow-uats/assets/test.images.txt
          if [ ! -f $IMAGE_LIST ]; then touch $IMAGE_LIST; fi

          while IFS= read -r image || [ -n "$image" ]; do
            # Trim whitespace
            image=$(echo "$image" | xargs)

            # Skip empty lines or commented lines starting with #
            if [[ -z "$image" || "$image" =~ ^# ]]; then
              continue
            fi

            echo "--------------------------------------------------"
            echo "🚀 Preloading: $image"
            echo "--------------------------------------------------"

            attempt=1
            success=false

            while [ $attempt -le $MAX_RETRIES ]; do
              if [ $attempt -gt 1 ]; then
                echo "⚠️ Attempt $attempt of $MAX_RETRIES: Retrying in $RETRY_DELAY seconds..."
                sleep $RETRY_DELAY
              fi

              # Execute pull via the snap path
              sudo /snap/k8s/current/bin/ctr \
                --address /run/containerd/containerd.sock \
                --namespace k8s.io \
                images pull "$image" > /tmp/import.out 2>&1

              if [ $? -eq 0 ]; then
                sudo /snap/k8s/current/bin/ctr \
                  --address /run/containerd/containerd.sock \
                  --namespace k8s.io \
                  image label "$image" io.cri-containerd.pinned=pinned

                echo "✅ Successfully pulled $image on attempt $attempt"
                success=true
                break
              else
                echo "❌ Attempt $attempt failed for $image"
                ((attempt++))
              fi
            done

            if [ "$success" = false ]; then
              echo "::error::Failed to pull $image after $MAX_RETRIES attempts."
              echo "::error::Logs:"
              cat /tmp/import.out
              exit 1
            fi
          done < $IMAGE_LIST

      - name: Run UATs
        run: |
          cd ~/charmed-kubeflow-uats	  
          tox -e ${{ matrix.bundle.uats.env }} -- ${{ matrix.bundle.uats.extra-args }}

      - name: Setup tmate session
        if: failure()
        uses: canonical/action-tmate@main

      # On failure, capture debugging resources
      - name: Select model
        run: juju switch kubeflow
        if: failure() || cancelled()

      - name: Get juju status
        run: juju status
        if: failure() || cancelled()

      - name: Get juju debug logs
        run: juju debug-log --replay --no-tail
        if: failure() || cancelled()

      - name: Get all kubernetes resources
        run: kubectl get all -A
        if: failure() || cancelled()

      - name: Describe all pods
        if: failure() || cancelled()
        run: kubectl describe pods --all-namespaces

      - name: Get logs from pods with status = Pending
        run: kubectl -n kubeflow get pods | tail -n +2 | grep Pending | awk '{print $1}' | xargs -n1 kubectl -n kubeflow logs --all-containers=true --tail 100 || true
        if: failure() || cancelled()

      - name: Get logs from pods with status = Failed
        run: kubectl -n kubeflow get pods | tail -n +2 | grep Failed | awk '{print $1}' | xargs -n1 kubectl -n kubeflow logs --all-containers=true --tail 100 || true
        if: failure() || cancelled()

      - name: Get logs from pods with status = CrashLoopBackOff
        run: kubectl -n kubeflow get pods | tail -n +2 | grep CrashLoopBackOff | awk '{print $1}' | xargs -n1 kubectl -n kubeflow logs --all-containers=true --tail 100 || true
        if: failure() || cancelled()
